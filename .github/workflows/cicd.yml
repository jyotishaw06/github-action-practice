name: CICD

on:
  workflow_dispatch: 

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build the use docker
        run: echo "build the Docker"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Ubuntu test case
        run: echo "test case app"
  deploy:
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the code
        run: echo "Deploying the code"
  
